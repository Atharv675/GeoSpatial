<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Scene 5 — Outro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: 'Inter', sans-serif; color: #e7ecf3; }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .outro-emblem {
        width: 120px;
        height: 120px;
        border-radius: 30px;
        background: linear-gradient(135deg, #1f2d42 0%, #101620 100%);
        border: 2px solid #3d8bfd;
        box-shadow: 0 0 60px rgba(61, 139, 253, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
      }
      .outro-emblem svg {
        width: 64px;
        height: 64px;
        fill: none;
        stroke: #3d8bfd;
        stroke-width: 2.2;
      }
      .outro-title {
        font-size: 96px;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: #fff;
        margin-bottom: 12px;
      }
      .outro-tagline {
        font-size: 32px;
        font-weight: 600;
        color: #3d8bfd;
        letter-spacing: -0.01em;
        margin-bottom: 40px;
      }
      .stack-badges { display: flex; gap: 16px; }
      .tech-pill {
        padding: 8px 20px;
        border-radius: 30px;
        background: rgba(26, 35, 50, 0.9);
        border: 1px solid #2a3548;
        color: #e7ecf3;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene5" data-width="1920" data-height="1080">
      <div class="outro-emblem" id="s5-emblem">
        <svg viewBox="0 0 24 24">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </div>
      <h1 class="outro-title" id="s5-title">GeoSentinel</h1>
      <p class="outro-tagline" id="s5-tag">
        Orbital Intelligence. Ground Truth. Zero Guesswork.
      </p>
      <div class="stack-badges" id="s5-badges">
        <div class="tech-pill">FASTAPI</div>
        <div class="tech-pill">REACT 18</div>
        <div class="tech-pill">POSTGIS 3.4</div>
        <div class="tech-pill">LEAFLET</div>
        <div class="tech-pill">COPERNICUS</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s5-emblem", { scale: 0.5, opacity: 0, rotation: -45 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 0.1)
        .fromTo("#s5-title", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.4)
        .fromTo("#s5-tag", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5 }, 0.7)
        .fromTo("#s5-badges", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5 }, 1.0);
      window.__timelines["scene5"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
